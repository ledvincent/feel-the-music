[project]
name = "mood"
version = "0.1.0"
description = "Local tools that turn indie love songs into silent, cinematic 9:16 reels."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "torch>=2.4",
    "yt-dlp>=2024.10.7",
]

[project.scripts]
mood = "mood.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mood"]

# PyTorch comes from its CUDA index; only torch is taken from it (design D6).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the real GPU; never run by default"]
addopts = "-m 'not gpu'"
